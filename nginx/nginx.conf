worker_processes auto;
error_log /dev/stderr warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    # --- Basic settings ---
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # --- Logging ---
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /dev/stdout main;

    # --- Upstream: NurseAid app ---
    upstream nurseaid_app {
        server nurseaid:3333;
    }

    # --- HTTP → HTTPS redirect ---
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # --- HTTPS server ---
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # --- TLS certificates (self-signed) ---
        ssl_certificate     /etc/nginx/certs/nurseaid.crt;
        ssl_certificate_key /etc/nginx/certs/nurseaid.key;

        # --- TLS hardening ---
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # --- Security headers ---
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # --- Proxy to NurseAid app ---
        location / {
            proxy_pass http://nurseaid_app;
            proxy_http_version 1.1;

            # WebSocket support (for live dashboard, Socket.IO, etc.)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Forward real client info
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # --- Health check passthrough ---
        location /health {
            proxy_pass http://nurseaid_app;
            proxy_set_header Host $host;
        }
    }
}
