# Mosquitto Configuration
# NurseAid MQTT Broker Configuration

# Listener
listener 1883

# Authentication - allow anonymous for local deployment
allow_anonymous true

# Production logging goes to stdout where Docker's bounded json-file rotation
# prevents an unbounded broker log from filling the Raspberry Pi filesystem.
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages false

# Persistence
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db

# Max connections
max_connections 100
