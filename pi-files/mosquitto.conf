# Mosquitto Configuration
# NurseAid MQTT Broker Configuration

# Listener
listener 1883

# Authentication - allow anonymous for local deployment
allow_anonymous true

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type all

# Persistence
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db

# Max connections
max_connections 100
